<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Lit diya">
  <defs>
    <radialGradient id="d-glow" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#ffcc33" stop-opacity=".8"/>
      <stop offset="55%" stop-color="#ff8c1a" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#ff8c1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="d-flame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fff4d0"/>
      <stop offset="45%" stop-color="#ffcc33"/>
      <stop offset="100%" stop-color="#ff7a18"/>
    </linearGradient>
    <linearGradient id="d-bowl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4703a"/>
      <stop offset="100%" stop-color="#8c3f1d"/>
    </linearGradient>
  </defs>

  <!-- Dark plate so the lamp reads against both light and dark browser chrome. -->
  <rect width="64" height="64" rx="14" fill="#140f2e"/>
  <circle cx="32" cy="28" r="24" fill="url(#d-glow)"/>

  <!-- Flame: one broad teardrop, big enough to stay legible at 16px. -->
  <path d="M32 14c6 7 9.2 12 9.2 16.6A9.2 9.2 0 0 1 22.8 30.6C22.8 26 26 21 32 14z" fill="url(#d-flame)"/>
  <path d="M32 23c2.6 3.4 4 5.9 4 8.1a4 4 0 0 1-8 0c0-2.2 1.4-4.7 4-8.1z" fill="#fff6dd" opacity=".9"/>

  <!-- Terracotta bowl. -->
  <path d="M8 40h48c0 7.6-10.7 13.6-24 13.6S8 47.6 8 40z" fill="url(#d-bowl)"/>
  <path d="M8 40h48a4.2 4.2 0 0 1-4.2 3.4H12.2A4.2 4.2 0 0 1 8 40z" fill="#f0a35a" opacity=".55"/>
</svg>
